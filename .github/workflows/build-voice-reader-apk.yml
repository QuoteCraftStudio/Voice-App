name: Build Voice Reader APK
on:
  push:
    branches: [release/voice-reader-background-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER" || { echo "SDK manager not installed"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceReader-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
